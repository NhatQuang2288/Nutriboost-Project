# Git hook — chạy nhanh, không phụ thuộc node_modules của husky.
# Cài: npx lefthook install

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{ts,tsx}'
      # `--no-warn-ignored`: ESLint cố tình bỏ qua `**/*.config.{js,mjs,ts}` (xem eslint.config.mjs),
      # nhưng lefthook vẫn truyền tệp cấu hình vào theo glob. Không có cờ này thì cảnh báo
      # "File ignored" bị `--max-warnings=0` biến thành lỗi, và commit chỉ chạm một tệp cấu hình
      # — ví dụ `playwright.config.ts` — bị chặn oan.
      run: npx eslint --max-warnings=0 --no-warn-ignored {staged_files}

    - name: chặn thư viện icon
      run: node scripts/check-no-icon-libs.mjs

commit-msg:
  jobs:
    - name: conventional commit
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck

    - name: test
      run: npm run test
